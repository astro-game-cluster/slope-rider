<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Adsterra 320x50 Sticky Anchor</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
      html {
        color-scheme: light;
      }
      html.dark {
        color-scheme: dark;
      }
      html.dark div[id^="container-"] {
        filter: brightness(0.95) contrast(1.05);
      }
      html.dark a {
        color: #e5e7eb !important;
      }
    </style>
    <script>
      (function () {
        function applyTheme(isDark) {
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
        try {
          var isDark = false;
          if (window.parent && window.parent.document && window.parent.document.documentElement) {
            isDark = window.parent.document.documentElement.classList.contains('dark');
          } else {
            var saved = localStorage.getItem('theme');
            isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          applyTheme(isDark);
        } catch (e) {
          try {
            applyTheme(localStorage.getItem('theme') === 'dark');
          } catch (err) {}
        }
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'theme-change') {
            applyTheme(event.data.theme === 'dark');
          }
        });
      })();
    </script>
  </head>
  <body>
    <!-- 
      Adsterra 320x50 移动端专用横幅
      请将下方配置中的 key 和 invoke.js 替换为您在 Adsterra 后台申请到的真实代码
    -->
    <script type="text/javascript">
      atOptions = {
        'key': 'REPLACE_WITH_YOUR_320x50_KEY',
        'format': 'iframe',
        'height': 50,
        'width': 320,
        'params': {}
      };
    </script>
    <script type="text/javascript" src="//www.topcreativeformat.com/REPLACE_WITH_YOUR_320x50_KEY/invoke.js"></script>
  </body>
</html>
